<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HS PANEL PRO</title>
<style>
body {
  margin: 0;
  background: #090909;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
header {
  background: #e50914;
  padding: 22px 10px;
  font-size: 26px;
  font-weight: bold;
}
.card {
  background: #191919;
  margin: 18px;
  padding: 20px;
  border: 1px solid #e50914;
  border-radius: 15px;
}
button {
  background: #e50914;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 13px 20px;
  font-size: 16px;
}
p { color: #cccccc; }
</style>
</head>
<body>
<header>🎯 HS PANEL PRO</header>
<div class="card">
  <h2>HEADSHOT TRAINING</h2>
  <p>Practice your aim and improve your skills.</p>
  <button onclick="alert('Practice dragging your aim upward!')">
    START PRACTICE
  </button>
</div>
<div class="card">
  <h2>SENSITIVITY GUIDE</h2>
  <p>General: 95–100</p>
  <p>Red Dot: 90–100</p>
  <p>2x Scope: 85–95</p>
  <p>4x Scope: 75–85</p>
</div>
<div class="card">
  <h2>ABOUT</h2>
  <p>Independent gaming practice guide.</p>
  <p>Not affiliated with Garena Free Fire.</p>
</div>
</body>
</html>
